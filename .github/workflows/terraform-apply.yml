name: terraform apply

# Promotes a merged change through dev, staging and prod in order. Each job
# names a GitHub Environment: that is what gates the apply role (the trust
# policy in modules/github-oidc requires `environment:<name>` in the OIDC
# subject) and where required-reviewer rules live. Add reviewers to the `prod`
# environment in repository settings — without them, prod applies unattended.
on:
  push:
    branches: [main]
    paths:
      - "src/terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.0"
  AWS_REGION: eu-west-2
  PROJECT: uca

jobs:
  dev:
    name: apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/${{ env.PROJECT }}-dev-ci-apply
          role-session-name: gha-apply-dev-${{ github.run_id }}
      - run: terraform -chdir=src/terraform/envs/dev init
      - run: terraform -chdir=src/terraform/envs/dev apply -auto-approve -lock-timeout=5m

  staging:
    name: apply (staging)
    needs: dev
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/${{ env.PROJECT }}-staging-ci-apply
          role-session-name: gha-apply-staging-${{ github.run_id }}
      - run: terraform -chdir=src/terraform/envs/staging init
      - run: terraform -chdir=src/terraform/envs/staging apply -auto-approve -lock-timeout=5m

  prod:
    name: apply (prod)
    needs: staging
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/${{ env.PROJECT }}-prod-ci-apply
          role-session-name: gha-apply-prod-${{ github.run_id }}
      - run: terraform -chdir=src/terraform/envs/prod init

      # Plan and apply as separate steps so the approval reviewer sees the plan
      # in the log immediately above the change it authorised.
      - run: terraform -chdir=src/terraform/envs/prod plan -lock-timeout=5m -out=tfplan
      - run: terraform -chdir=src/terraform/envs/prod apply -lock-timeout=5m tfplan
